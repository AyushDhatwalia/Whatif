<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart | Whatif</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111111;
            color: #f1f1f1;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #000000;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }
        #logo {
            color: #eef0f2;
            font-size: 3.2vw;
            font-family: Impact;
            font-weight: bolder;
            text-decoration: none;
        }
        .cart-icon {
            color: #ffffff;
            font-size: 2rem;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
        }
        .cart-icon i {
            margin-right: 10px;
        }
        .cart-icon:hover {
            color: #e50914;
        }
        .cart-container {
            max-width: 1200px;
            margin: 50px auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .cart-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            background-color: #222222;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }
        .cart-item:hover {
            transform: scale(1.05);
        }
        .cart-item img {
            max-width: 120px;
            border-radius: 10px;
        }
        .cart-item-details {
            flex-grow: 1;
            margin-left: 20px;
        }
        .cart-item-name {
            font-size: 24px;
            color: #ffffff;
        }
        .cart-item-price {
            font-size: 20px;
            color: #e50914;
        }
        .cart-item-remove {
            background-color: #e50914;
            color: #ffffff;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .cart-item-remove:hover {
            background-color: #f1f1f1;
            color: #111111;
        }
        .total {
            font-size: 28px;
            font-weight: bold;
            text-align: right;
            color: #ffffff;
        }
        .checkout-button {
            background-color: #e50914;
            color: #ffffff;
            padding: 15px 30px;
            border: none;
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
            display: block;
            width: 100%;
            margin-top: 20px;
            text-align: center;
        }
        .checkout-button:hover {
            background-color: #f1f1f1;
            color: #111111;
        }
        footer {
            background-color: #000000;
            padding: 20px;
            text-align: center;
            color: #ffffff;
        }
        .social-links a {
            margin: 0 10px;
            color: #ffffff;
            text-decoration: none;
        }
        .social-links a:hover {
            color: #e50914;
        }
    </style>
</head>
<body>

<header>
    <a id="logo" href="account.html">What if</a>
    <a class="cart-icon" href="cart.html">
        <img src="Images\cart.svg">
    </a>
</header>

<div class="cart-container" id="cartContainer">
</div>
<div class="total" id="totalAmount">
    Total: ₹0
</div>

<button class="checkout-button" id="checkoutButton" onclick="checkout()">Proceed to Checkout</button>

<footer>
    <div>Follow us:</div>
    <div class="social-links">
        <a href="#">Facebook</a>
        <a href="#">Instagram</a>
        <a href="#">Twitter</a>
    </div>
    <p>&copy; 2025 Whatif . All rights reserved.</p>
</footer>
<script src="https://kit.fontawesome.com/a076d05399.js"></script>

<script>
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    function displayCart() {
        const cartContainer = document.getElementById("cartContainer");
        const totalAmountElement = document.getElementById("totalAmount");
        cartContainer.innerHTML = "";

        let total = 0;

        cart.forEach((product, index) => {
            const cartItemDiv = document.createElement("div");
            cartItemDiv.classList.add("cart-item");

            const itemHTML = `
                <img src="Images/${product.image}" alt="${product.name}">
                <div class="cart-item-details">
                    <div class="cart-item-name">${product.name}</div>
                    <div class="cart-item-price">₹${product.price}</div>
                </div>
                <button class="cart-item-remove" onclick="removeFromCart(${index})">Remove</button>
            `;

            cartItemDiv.innerHTML = itemHTML;
            cartContainer.appendChild(cartItemDiv);

            total += product.price;
        });

        totalAmountElement.textContent = `Total: ₹${total}`;

        if (cart.length === 0) {
            cartContainer.innerHTML = "<p style='color: white;'>Your cart is empty.</p>";
        }
    }

    function removeFromCart(index) {
        cart.splice(index, 1);
        localStorage.setItem("cart", JSON.stringify(cart));
        displayCart();
    }

    function checkout() {
        if (cart.length === 0) {
            alert("Your cart is empty!");
            return;
        }
        alert("Proceeding to checkout!");
    }

    displayCart();
</script>

</body>
</html>
